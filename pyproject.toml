[project]
name = "axon"
version = "2.8.8"
authors = [
    { name = "Your Organization", email = "support@yourcompany.com"}
]
description = "Simple, open source messaging tool"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "linkpreview~=0.9.0",
  "openai>=1.100.2",
  "blurhash-python",
  "openai-agents>=0.0.16",
  "markitdown",
  "pandas",
  "google-cloud-documentai",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<=17.0.0-dev"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "../axon/public/axon"
index_html_path = "../axon/www/axon.html"

[project.urls]
Homepage = "https://www.yourcompany.com/"
Repository = "https://github.com/your-org/axon.git"
"Bug Reports" = "https://github.com/your-org/axon/issues"
